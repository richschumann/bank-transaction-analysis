<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BankTrends Analysis</title>
  </head>

  <body>
    <h1>BankTrends Analysis</h1>
    
  <section>
    <h2>Branch Selection</h2>
    <select id="branch-select">
      <option value="North Branch">North Branch</option>
      <option value="South Branch">South Branch</option>
      <option value="Central Branch">Central Branch</option>
    </select>
  </section>
    
  <section>
    <h2>Reporting Period</h2>
    <select id="report-period">
      <option value="monthly">Monthly</option>
      <option value="quarterly">Quarterly</option>
    </select>
  </section> 
    
  <section>
    <h2>Total Deposits</h2>
    <p id="total-deposits"></p>
  </section>
    
  <section>
    <h2>Total Withdrawals</h2>
    <p id="total-withdrawals"></p>
  </section>  

  <section>
    <h2>Net Transaction Activity</h2>
    <p id="net-transaction-activity"></p>
  </section>

  <section>
    <h2>Branch Performance Rankings</h2>
    <ul id="branch-rankings"></ul>
  </section>

  <section>
    <h2>KPI Details</h2>
    <p id="kpi-details"></p>
  </section>

  <section>
    <h2>Reporting Status</h2>
    <p id="report-message"></p>
  </section>  
   <script src="./script.js"></script>
  </body>
</html>
